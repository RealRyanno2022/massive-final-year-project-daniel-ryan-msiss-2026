name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install uv (fast Python package manager)
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Cache uv packages to speed up builds
      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system jupyter nbconvert


      # 6. Run Jupyter Notebooks (execute all .ipynb files)
      - name: Run Jupyter notebooks
        run: |
          for nb in $(find . -name "*.ipynb" -not -path "*/.ipynb_checkpoints/*"); do
            echo "Running notebook: $nb"
            jupyter nbconvert --to notebook --execute "$nb" --output "$nb"
          done

      # 7. Optional: Commit executed notebooks as artifacts (useful for testing)
      - name: Upload executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: ./**/*.ipynb
